services:
    nginx:
        image: nginx:1.27.2
        volumes:
            - ./nginx/host.octane.conf:/etc/nginx/conf.d/default.conf
        ports:
            - 80:80
        networks:
            - autumn-webserver
        depends_on:
            maple:
                condition: service_healthy

    maple:
        build:
            context: ./maple
            dockerfile: ./docker/RoadRunner.Dockerfile
        image: autumn/maple:0.0.1
        env_file: ./maple/.env.production
        networks:
            - autumn-webserver
            - autumn-service
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
            interval: 15s
            timeout: 5s
            retries: 3
            start_period: 10s
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            minio:
                condition: service_started

    maple-worker:
        build:
            context: ./maple
            dockerfile: ./docker/RoadRunner.Dockerfile
        image: autumn/maple:0.0.1
        env_file: ./maple/.env.production
        environment:
            CONTAINER_MODE: worker
            WORKER_COMMAND: php /var/www/html/artisan queue:work
        networks:
            - autumn-webserver
            - autumn-service
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
            interval: 15s
            timeout: 5s
            retries: 3
            start_period: 10s
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            minio:
                condition: service_started

    postgres:
        image: postgres:15
        ports:
            - 5432:5432
        environment:
            TZ: UTC
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: secret
        volumes:
            - "postgres:/var/lib/postgresql/data"
            - "./postgres/init-database.sql:/docker-entrypoint-initdb.d/00-create-initial-database.sql"
            - "./postgres/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql"
        networks:
            - autumn-service
        healthcheck:
            test: ["CMD", "pg_isready", "-q", "-d", "postgres", "-U", "secret"]
            retries: 3
            timeout: 5s

    redis:
        image: redis:7.4-alpine
        ports:
            - 6379:6379
        volumes:
            - redis:/data
        networks:
            - autumn-service
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            retries: 3
            timeout: 5s

    minio:
        image: minio/minio:RELEASE.2024-10-13T13-34-11Z
        ports:
            - 8900:8900
            - 9000:9000
        environment:
            MINIO_ROOT_USER: minio
            MINIO_ROOT_PASSWORD: minio123
        command: minio server /data --console-address ":8900"
        volumes:
            - minio:/data
        networks:
            - autumn-service
        healthcheck:
            test: ["CMD", "mc", "ready", "local"]
            retries: 3
            timeout: 5s

    mailpit:
        image: axllent/mailpit:v1.21.0
        ports:
            - 1025:1025
            - 8025:8025
        networks:
            - autumn-service

networks:
    autumn-webserver:
        driver: bridge
        name: autumn-webserver

    autumn-service:
        driver: bridge
        name: autumn-service

volumes:
    postgres:
    redis:
    minio:
