services:
    nginx:
        image: nginx:1.27.2
        volumes:
            - ./nginx/host.octane.conf:/etc/nginx/conf.d/default.conf
        ports:
            - 80:80
        networks:
            - autumn-network
        depends_on:
            maple:
                condition: service_healthy
    maple:
        build:
            context: ./maple
            dockerfile: ./docker/RoadRunner.Dockerfile
        image: "autumn/maple:${APP_VERSION}"
        env_file: ./maple/.env.production
        networks:
            - autumn-network
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
            interval: 15s
            timeout: 5s
            retries: 3
            start_period: 10s
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            minio:
                condition: service_started
    postgres:
        image: "postgres:15"
        ports:
            - "${FORWARD_DB_PORT:-5432}:5432"
        environment:
            TZ: UTC
            PGPASSWORD: "${DB_PASSWORD:-secret}"
            POSTGRES_DB: "${DB_DATABASE}"
            POSTGRES_USER: "${DB_USERNAME}"
            POSTGRES_PASSWORD: "${DB_PASSWORD:-secret}"
        volumes:
            - "postgres:/var/lib/postgresql/data"
            - "./postgres/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql"
        networks:
            - autumn-network
        healthcheck:
            test:
                [
                    "CMD",
                    "pg_isready",
                    "-q",
                    "-d",
                    "${DB_DATABASE}",
                    "-U",
                    "${DB_USERNAME}",
                ]
            retries: 3
            timeout: 5s
    redis:
        image: "redis:7.4-alpine"
        ports:
            - "${FORWARD_REDIS_PORT:-6379}:6379"
        volumes:
            - "redis:/data"
        networks:
            - autumn-network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            retries: 3
            timeout: 5s
    minio:
        image: "minio/minio:RELEASE.2024-10-13T13-34-11Z"
        ports:
            - "${FORWARD_MINIO_PORT:-9000}:9000"
            - "${FORWARD_MINIO_CONSOLE_PORT:-8900}:8900"
        environment:
            MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
            MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
        command: minio server /data --console-address ":8900"
        volumes:
            - "minio:/data"
        networks:
            - autumn-network
        healthcheck:
            test: ["CMD", "mc", "ready", "local"]
            retries: 3
            timeout: 5s

networks:
    autumn-network:
        driver: bridge
        name: autumn-network
volumes:
    postgres:
    redis:
    minio:
